services:
  app:
    build: .
    image: dasha-cave-site:latest
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NITRO_PORT: 3000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
