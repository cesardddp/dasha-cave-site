services:
  app:
    build: .
    image: dasha-cave-site:latest
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - books_data:/app/.data
      - book_uploads:/app/public/uploads
    environment:
      NITRO_PORT: 3000
      NUXT_ADMIN_USER_IDS: ${NUXT_ADMIN_USER_IDS:-}
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:-}
      DATABASE_PATH: ${DATABASE_PATH:-/app/.data/blog.sqlite}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  books_data:
  book_uploads:
